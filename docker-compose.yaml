services:
  jaeger:
    image: jaegertracing/jaeger:2.22.0
    ports:
      - "16686:16686" # UI

  collector-gateway:
    image: otel/opentelemetry-collector:0.163.2
    volumes:
      - ./collector-gateway.yaml:/etc/collector-gateway.yaml
    command: ["--config=/etc/collector-gateway.yaml"]
    ports:
      - "1888:1888"   # pprof extension
      - "13133:13133" # health_check extension
      - "4317:4317"   # OTLP gRPC receiver
      - "55679:55679" # zpages extension
    depends_on:
      - jaeger

  ibsen:
    build: .
    command: ["server", "-d", "/data", "-e", "collector-gateway:4317"]
    ports:
      - "54321:54321"
    depends_on:
      - collector-gateway
