name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # the go directive in go.mod is the single source of truth for the version
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l core adapter wiring clients main.go errore)
          if [ -n "$unformatted" ]; then
            echo "not gofmt'd:" >&2
            echo "$unformatted" >&2
            exit 1
          fi

      # Every relative link and #anchor in the Markdown resolves, so a moved section cannot
      # leave a link behind.
      - name: markdown links
        run: python3 scripts/check-links.py

      - name: go vet
        run: go vet ./...

      # The kernel lock is chosen by build constraints, so the platforms without flock, or
      # without a way to read the filesystem type, are built too: they must compile and pick
      # the lease file.
      - name: cross-compile
        run: |
          for target in windows/amd64 darwin/arm64 freebsd/amd64 openbsd/amd64 linux/arm; do
            echo "$target"
            GOOS=${target%/*} GOARCH=${target#*/} go build ./...
          done

      # The north star: the core imports only the standard library, and dependencies point
      # inward. See scripts/check-architecture.sh for the three rules.
      - name: architecture
        run: ./scripts/check-architecture.sh

      # The same claim from the other side: what the linker produced, not what the imports
      # promised. Prints the two sizes, and fails if an embedded build stops being smaller
      # than the server.
      - name: embedded build size
        run: ./scripts/embedded-size.sh

      - name: go test -race
        run: go test -race ./...

  # The release configuration, built as a snapshot so it cannot break unnoticed between
  # releases, and one of the binaries it makes put through the README's quick start.
  release-snapshot:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --snapshot --clean

      - name: smoke test
        run: ./scripts/smoke-test.sh dist/ibsen_linux_amd64_v1/ibsen

  # Everything generated from the proto is committed, so a plain go build needs no protoc.
  # This regenerates it all with the pinned generators and fails if anything differs, so the
  # committed code never goes stale against the proto.
  generated-code:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: regenerate
        run: ./scripts/gen-clients.sh
      - name: nothing changed
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "generated code is stale; run scripts/gen-clients.sh and commit:" >&2
            git status --porcelain >&2
            git diff --stat >&2
            exit 1
          fi

  ibsen-binary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: CGO_ENABLED=0 go build -o ibsen .
      - uses: actions/upload-artifact@v4
        with:
          name: ibsen
          path: ibsen

  # Each bundled client, generated by the binary and built and run in a container holding only
  # that language's toolchain, against an in-memory server: proof the clients really work.
  client-example:
    needs: ibsen-binary
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: go
            image: golang:1.26
          - language: java
            image: maven:3.9-eclipse-temurin-17
          - language: python
            image: python:3.12
          - language: typescript
            image: node:22
    container: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ibsen
      - run: chmod +x ibsen && ./scripts/client-example.sh ${{ matrix.language }} ./ibsen
