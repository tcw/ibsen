syntax = "proto3";

option go_package = "/api/grpcApi";
option java_multiple_files = true;
option java_package = "github.com.tcw.ibsen.client";
option java_outer_classname = "IbsenProto";
option objc_class_prefix = "IBSEN";

service Ibsen {
  rpc write (InputEntries) returns (WriteStatus) {
  }
  rpc read (ReadParams) returns (stream OutputEntries) {
  }
  rpc list (EmptyArgs) returns (TopicList){
  }
}

message EmptyArgs{
}

message WriteStatus {
  int64 wrote = 1;
  // where the entries are: the first offset, and wrote of them from there
  uint64 firstOffset = 2;
  // the write was a retry of one already stored at these offsets, and nothing was appended
  bool duplicate = 3;
}

message ReadParams {
  string topic = 1;
  uint64 offset = 2;
  uint32 batchSize = 3;
  bool stopOnCompletion = 4;
  // start at the earliest offset still retained when offset is older than it; without it
  // such a read fails with OUT_OF_RANGE, naming the earliest offset
  bool fromEarliest = 5;
}

message InputEntries {
  string topic = 1;
  repeated bytes entries = 2;
  // optional, for safe retries: 16 bytes naming the writer, and its number for this write.
  // Numbers run 1, 2, 3 per topic; a write sent again with the last number accepted is
  // answered as a duplicate, and a gap or an older number is FAILED_PRECONDITION.
  bytes producerId = 3;
  uint64 sequence = 4;
}

message TopicList{
  repeated string topics = 1;
}

message Entry{
  uint64 offset = 1;
  bytes content = 2;
}

message OutputEntries {
  repeated Entry entries = 2;
}